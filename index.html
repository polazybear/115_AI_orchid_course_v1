<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>蝴蝶蘭黃葉病離葉接種影像標註與表現型系統 (Research Edition v3)</title>
  <style>
    :root {
      --bg-dark: #18181f;
      --bg-panel: #24242e;
      --bg-card: #1c1c24;
      --accent: #4e80ee;
      --accent-hover: #3b6cd8;
      --text: #e4e4eb;
      --text-muted: #9494a8;
      --border: #3a3a4a;
      --success: #2ed573;
      --warning: #ffa502;
      --danger: #ff4757;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Layout */
    #sidebar-left {
      width: 270px;
      background-color: var(--bg-panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }
    #main-canvas-container {
      flex: 1;
      position: relative;
      background-color: #101014;
      overflow: hidden;
      cursor: crosshair;
    }
    #sidebar-right {
      width: 370px;
      background-color: var(--bg-panel);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 9px;
      overflow-y: auto;
    }

    .section-title {
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--text-muted);
      margin-bottom: 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 9px;
    }
    .btn {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 7px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.8rem;
      transition: background 0.15s;
    }
    .btn:hover { background-color: var(--accent-hover); }
    .btn-secondary { background-color: #3f3f4e; }
    .btn-secondary:hover { background-color: #4f4f62; }
    .btn-warning { background-color: #d68910; color: #fff; }
    .btn-warning:hover { background-color: #b9770e; }
    .btn-danger { background-color: #c0392b; }

    select, input[type="text"], input[type="number"] {
      width: 100%;
      padding: 5px 7px;
      background-color: #2e2e3b;
      color: white;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 0.8rem;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    label {
      display: block;
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    /* File List */
    #file-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
      border-top: 1px solid var(--border);
    }
    #file-list li {
      padding: 7px 10px;
      font-size: 0.78rem;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #file-list li:hover { background-color: #2f2f3d; }
    #file-list li.active { background-color: #363649; border-left: 4px solid var(--accent); }
    .badge {
      font-size: 0.66rem;
      padding: 2px 6px;
      border-radius: 10px;
      background: #4a4a5a;
    }
    .badge-done { background: #27ae60; }

    /* Tool Selector */
    .tool-btn {
      background: #2e2e3b;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 5px;
      border-radius: 4px;
      cursor: pointer;
      text-align: center;
      font-size: 0.75rem;
      transition: all 0.15s;
      line-height: 1.25;
    }
    .tool-btn.active {
      border-color: var(--accent);
      background-color: #36364d;
      color: white;
      font-weight: bold;
      box-shadow: inset 0 0 0 1px var(--accent);
    }
    .tool-sub {
      display: block;
      font-size: 0.65rem;
      color: #a0a0b8;
      font-weight: normal;
    }

    /* Lists */
    .item-list {
      list-style: none;
      max-height: 135px;
      overflow-y: auto;
      background: #16161d;
      border-radius: 4px;
      border: 1px solid var(--border);
    }
    .item-list li {
      padding: 5px 8px;
      font-size: 0.74rem;
      border-bottom: 1px solid #262632;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    canvas { position: absolute; top: 0; left: 0; }
    #info-overlay {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.78);
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 0.75rem;
      pointer-events: none;
    }
    #autosave-status {
      font-size: 0.7rem;
      color: var(--success);
      margin-top: 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>

  <!-- 左側：資料夾與進度管理 -->
  <div id="sidebar-left">
    <div style="padding: 10px;">
      <div class="section-title">1. 載入試驗影像與進度</div>
      <input type="file" id="folder-input" webkitdirectory directory multiple style="display:none;">
      <input type="file" id="json-input" accept=".json" style="display:none;">
      
      <button class="btn" style="width:100%; margin-bottom:5px;" onclick="document.getElementById('folder-input').click()">選擇單一 DAI 資料夾</button>
      <button class="btn btn-secondary" style="width:100%;" onclick="document.getElementById('json-input').click()">匯入進度 (.json) 接續標註</button>
      
      <div id="autosave-status">
        <span id="save-indicator">● 自動暫存已啟動</span>
        <button onclick="clearLocalBackup()" style="background:none; border:none; color:#9494a8; text-decoration:underline; cursor:pointer; font-size:0.68rem;">清除暫存</button>
      </div>
    </div>
    <ul id="file-list"></ul>
  </div>

  <!-- 中間：高解析度互動標註畫布 -->
  <div id="main-canvas-container">
    <canvas id="main-canvas"></canvas>
    <div id="info-overlay">縮放: <span id="zoom-level">100%</span> | 滾輪縮放，Space+拖曳平移 | <span id="mode-hint" style="color:#2ed573;">模式：拖曳拉框</span></div>
  </div>

  <!-- 右側：試驗欄位對齊與標註控制台 -->
  <div id="sidebar-right">
    
    <!-- 試驗 Metadata 欄位對應 -->
    <div class="card">
      <div class="section-title">2. 試驗欄位對應 (自動解析 + 可微調)</div>
      <div class="grid-2" style="margin-bottom: 5px;">
        <div>
          <label>品系 (Variety)</label>
          <input type="text" id="meta-variety" placeholder="例: TWM-F89054">
        </div>
        <div>
          <label>處理組別 (Treatment)</label>
          <select id="meta-treatment">
            <option value="Inoculated">Inoculated (接菌組)</option>
            <option value="Mock">Mock (對照組)</option>
          </select>
        </div>
      </div>
      <div class="grid-2">
        <div>
          <label>重複 (Repeat)</label>
          <input type="text" id="meta-repeat" placeholder="例: 1">
        </div>
        <div>
          <label>接種天數 (DAI)</label>
          <input type="text" id="meta-dai" placeholder="例: 2">
        </div>
      </div>
    </div>

    <!-- 比例尺與固定物理尺寸 ROI 設定 -->
    <div class="card">
      <div class="section-title">3. 比例尺標定 & 固定物理 ROI 設定</div>
      <div class="grid-2" style="margin-bottom: 6px;">
        <div>
          <label>1. 先畫比例尺實長 (mm)</label>
          <div style="display:flex; gap:4px; align-items:center;">
            <input type="number" id="scale-mm-input" value="10">
            <span style="font-size:0.75rem;">mm</span>
          </div>
        </div>
        <div>
          <label>2. 固定 ROI 邊長 (mm)</label>
          <div style="display:flex; gap:4px; align-items:center;">
            <input type="number" id="roi-mm-input" value="10" oninput="draw()">
            <span style="font-size:0.75rem;">mm</span>
          </div>
        </div>
      </div>
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <button class="tool-btn" style="flex:1; margin-right:8px;" data-class="scale_bar" onclick="setTool('scale_bar')">📏 畫比例尺線段 (Scale Bar)</button>
        <span style="font-size:0.74rem; color:var(--warning); font-weight:bold;" id="scale-ratio-display">尚未標定比例尺</span>
      </div>
    </div>

    <!-- 標註類別 (病徵範圍 + 固定尺度 ROI + 葉片) -->
    <div class="card">
      <div class="section-title">4. 選擇標註工具 (病徵範圍 / 固定 ROI / 葉片)</div>
      <div class="grid-2" style="margin-bottom: 6px;">
        <button class="tool-btn active" data-class="UP_symptom" onclick="setTool('UP_symptom')">
          🔴 UP 病徵範圍
          <span class="tool-sub">拖曳框選 + 綁定 Rank</span>
        </button>
        <button class="tool-btn" data-class="DOWN_symptom" onclick="setTool('DOWN_symptom')">
          🟠 DOWN 病徵範圍
          <span class="tool-sub">拖曳框選 + 綁定 Rank</span>
        </button>
        <button class="tool-btn" data-class="UP_ROI" onclick="setTool('UP_ROI')">
          🟦 UP 固定 ROI 小框
          <span class="tool-sub">單擊中心生成 10mm 框</span>
        </button>
        <button class="tool-btn" data-class="DOWN_ROI" onclick="setTool('DOWN_ROI')">
          🟪 DOWN 固定 ROI 小框
          <span class="tool-sub">單擊中心生成 10mm 框</span>
        </button>
      </div>
      <button class="tool-btn" style="width:100%;" data-class="leaf" onclick="setTool('leaf')">
        🟢 整片葉片區域 (Leaf ROI - 拖曳框選)
      </button>
    </div>

    <!-- 個體株號、人工 Rank 與缺株處理 -->
    <div class="card">
      <div class="section-title">5. 個體綁定、人工 Rank (0–10) 與缺株</div>
      <div class="grid-2" style="margin-bottom: 6px;">
        <div>
          <label>個體株號 (Individual)</label>
          <select id="plant-id-select">
            <option value="">無 (比例尺)</option>
          </select>
        </div>
        <div>
          <label>病徵人工 Rank (0–10)</label>
          <select id="rank-select">
            <option value="0">0 (無病徵)</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10 (全葉黃化/壞疽)</option>
          </select>
        </div>
      </div>
      <button class="btn btn-warning" style="width:100%;" onclick="markPlantMissing()">＋ 標記目前選定株號為「缺株 (Missing)」</button>
    </div>

    <!-- 標註與缺株清單 -->
    <div>
      <div class="section-title">6. 本張影像標註清單 (病徵 + Rank + ROI)</div>
      <ul class="item-list" id="annotation-list"></ul>
    </div>

    <!-- 匯出區 -->
    <div style="margin-top:auto; display:flex; flex-direction:column; gap:5px;">
      <button class="btn" onclick="exportCSV()">匯出總表 CSV (對齊 Variety/Repeat/Individual/Side/DAI/Rank)</button>
      <div class="grid-2">
        <button class="btn btn-secondary" onclick="exportYOLO()">匯出 YOLO (.txt)</button>
        <button class="btn btn-secondary" onclick="exportJSON()">下載備份 (.json)</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'orchid_annotator_autosave_v3';
    let fileList = [];
    let currentFileIndex = -1;
    let currentImage = new Image();
    let currentObjectUrl = null;
    
    let projectData = {}; 
    let currentTool = 'UP_symptom';
    let globalPxPerMm = null;

    const canvas = document.getElementById('main-canvas');
    const ctx = canvas.getContext('2d');
    let scale = 1, panX = 0, panY = 0;
    let isPanning = false, startPanX = 0, startPanY = 0;
    let isDrawing = false, startX = 0, startY = 0, currentRect = null;
    let mouseImgX = null, mouseImgY = null; // 追蹤滑鼠在圖片上的座標，用於預覽 10mm ROI 小方框

    // 類別定義 (0: leaf, 1: UP_symptom, 2: DOWN_symptom, 3: UP_ROI, 4: DOWN_ROI)
    const CLASS_MAP = {
      'leaf':         { id: 0, color: '#2ed573', label: 'Leaf' },
      'UP_symptom':   { id: 1, color: '#ff4757', label: 'UP_Symp' },
      'DOWN_symptom': { id: 2, color: '#ffa502', label: 'DOWN_Symp' },
      'UP_ROI':       { id: 3, color: '#1e90ff', label: 'UP_ROI' },
      'DOWN_ROI':     { id: 4, color: '#a55eea', label: 'DOWN_ROI' },
      'scale_bar':    { id: 5, color: '#00d2d3', label: 'Scale' }
    };

    function loadFromLocalStorage() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          projectData = JSON.parse(saved);
          const count = Object.keys(projectData).length;
          if (count > 0) {
            document.getElementById('save-indicator').innerText = `● 已從暫存還原 ${count} 張紀錄`;
          }
        }
      } catch (e) { console.warn('無法讀取暫存:', e); }
    }

    function saveToLocalStorage() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(projectData));
        const now = new Date().toLocaleTimeString('zh-TW', { hour12: false });
        document.getElementById('save-indicator').innerText = `● 已自動儲存 (${now})`;
      } catch (e) {
        document.getElementById('save-indicator').innerText = '⚠ 本機空間已滿，請下載 JSON';
        document.getElementById('save-indicator').style.color = '#ffa502';
      }
    }

    function clearLocalBackup() {
      if (confirm('確定要清空瀏覽器內的自動暫存紀錄嗎？（已下載的 CSV/JSON 不會受影響）')) {
        localStorage.removeItem(STORAGE_KEY);
        projectData = {};
        renderFileList();
        renderAnnotationList();
        draw();
        document.getElementById('save-indicator').innerText = '● 暫存已清空';
      }
    }

    document.getElementById('json-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const imported = JSON.parse(ev.target.result);
          projectData = { ...projectData, ...imported };
          saveToLocalStorage();
          renderFileList();
          if (currentFileIndex !== -1) loadFile(currentFileIndex);
          alert(`成功匯入 ${Object.keys(imported).length} 張影像進度！請選擇對應 DAI 資料夾繼續標註。`);
        } catch (err) { alert('JSON 檔案格式錯誤'); }
      };
      reader.readAsText(file);
      e.target.value = '';
    });

    function resizeCanvas() {
      const container = document.getElementById('main-canvas-container');
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
      draw();
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    loadFromLocalStorage();

    document.getElementById('folder-input').addEventListener('change', (e) => {
      const files = Array.from(e.target.files).filter(f => f.type.startsWith('image/'));
      if (files.length === 0) return;

      if (files.length > 100) {
        const proceed = confirm(`偵測到 ${files.length} 張影像，一次載入過多照片可能卡頓。\n建議點「取消」並改選單一 DAI 資料夾。確定仍要載入嗎？`);
        if (!proceed) { e.target.value = ''; return; }
      }

      fileList = files.map(f => ({
        file: f,
        name: f.name,
        path: f.webkitRelativePath || f.name,
        parsed: parsePathAndFilename(f.webkitRelativePath || f.name, f.name)
      }));

      renderFileList();
      loadFile(0);
    });

    function parsePathAndFilename(fullPath, filename) {
      const nameWithoutExt = filename.substring(0, filename.lastIndexOf('.')) || filename;
      const parts = nameWithoutExt.split('_');
      
      let rawRange = parts[parts.length - 1] || '';
      let variety = parts.slice(1, parts.length - 1).join('_') || parts[0] || 'Unknown';
      let isMock = /mock/i.test(fullPath);
      let treatment = isMock ? 'Mock' : 'Inoculated';
      let repeatMatch = fullPath.match(/Repeat[_-]?(\d+)/i);
      let repeat = repeatMatch ? repeatMatch[1] : '';
      let daiMatch = fullPath.match(/(\d+)\s*DAI/i);
      let dai = daiMatch ? daiMatch[1] : '';

      let plants = [];
      if (rawRange.includes('-')) {
        const [start, end] = rawRange.split('-').map(Number);
        if (!isNaN(start) && !isNaN(end)) {
          for (let i = start; i <= end; i++) plants.push(i);
        }
      } else if (/^\d+$/.test(rawRange)) {
        plants = rawRange.split('').map(n => n === '0' ? 10 : Number(n));
      }

      return { variety, repeat, dai, treatment, plants, rawRange };
    }

    ['meta-variety', 'meta-treatment', 'meta-repeat', 'meta-dai'].forEach(id => {
      document.getElementById(id).addEventListener('input', () => {
        if (currentFileIndex === -1) return;
        const fname = fileList[currentFileIndex].name;
        if (!projectData[fname]) initFileData(fname);
        projectData[fname].meta = {
          variety: document.getElementById('meta-variety').value,
          treatment: document.getElementById('meta-treatment').value,
          repeat: document.getElementById('meta-repeat').value,
          dai: document.getElementById('meta-dai').value
        };
        saveToLocalStorage();
      });
    });

    function initFileData(fname) {
      const item = fileList.find(f => f.name === fname);
      projectData[fname] = {
        boxes: [],
        missingPlants: [],
        imgWidth: 0,
        imgHeight: 0,
        pxPerMm: null,
        meta: {
          variety: item ? item.parsed.variety : '',
          treatment: item ? item.parsed.treatment : 'Inoculated',
          repeat: item ? item.parsed.repeat : '',
          dai: item ? item.parsed.dai : ''
        }
      };
    }

    function renderFileList() {
      const ul = document.getElementById('file-list');
      ul.innerHTML = '';
      fileList.forEach((item, index) => {
        const li = document.createElement('li');
        li.className = index === currentFileIndex ? 'active' : '';
        const data = projectData[item.name];
        const hasData = data && (data.boxes.length > 0 || data.missingPlants.length > 0);
        li.innerHTML = `
          <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:170px;">${item.name}</span>
          <span class="badge ${hasData ? 'badge-done' : ''}">${hasData ? '已紀錄' : '待處理'}</span>
        `;
        li.onclick = () => loadFile(index);
        ul.appendChild(li);
      });
    }

    function loadFile(index) {
      currentFileIndex = index;
      renderFileList();
      const item = fileList[index];
      if (!projectData[item.name]) initFileData(item.name);
      const currentData = projectData[item.name];

      document.getElementById('meta-variety').value = currentData.meta.variety;
      document.getElementById('meta-treatment').value = currentData.meta.treatment;
      document.getElementById('meta-repeat').value = currentData.meta.repeat;
      document.getElementById('meta-dai').value = currentData.meta.dai;

      const activeRatio = currentData.pxPerMm || globalPxPerMm;
      updateScaleDisplay(activeRatio);

      const select = document.getElementById('plant-id-select');
      select.innerHTML = '<option value="">無 (比例尺)</option>';
      item.parsed.plants.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p;
        opt.textContent = `個體株號 #${p}`;
        select.appendChild(opt);
      });
      if (item.parsed.plants.length > 0) select.value = item.parsed.plants[0];

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ffffff';
      ctx.font = '16px sans-serif';
      ctx.fillText('正在讀取高解析度影像，請稍候...', 40, 60);

      if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
      currentObjectUrl = URL.createObjectURL(item.file);
      const img = new Image();
      img.onload = () => {
        currentImage = img;
        projectData[item.name].imgWidth = img.width;
        projectData[item.name].imgHeight = img.height;
        saveToLocalStorage();

        resetView();
        renderAnnotationList();
        draw();
      };
      img.onerror = () => alert('圖片讀取失敗，請確認 Google Drive 資料夾已設為「可離線存取」。');
      img.src = currentObjectUrl;
    }

    function updateScaleDisplay(ratio) {
      const el = document.getElementById('scale-ratio-display');
      if (ratio) {
        el.innerText = `已標定: ${ratio.toFixed(1)} px/mm`;
        el.style.color = '#2ed573';
      } else {
        el.innerText = '尚未標定比例尺';
        el.style.color = '#ffa502';
      }
    }

    function getActivePxPerMm() {
      if (currentFileIndex === -1) return globalPxPerMm;
      const fname = fileList[currentFileIndex].name;
      return projectData[fname]?.pxPerMm || globalPxPerMm;
    }

    function resetView() {
      scale = Math.min(canvas.width / currentImage.width, canvas.height / currentImage.height) * 0.9;
      panX = (canvas.width - currentImage.width * scale) / 2;
      panY = (canvas.height - currentImage.height * scale) / 2;
      document.getElementById('zoom-level').innerText = `${Math.round(scale * 100)}%`;
    }

    function markPlantMissing() {
      if (currentFileIndex === -1) return;
      const plantId = document.getElementById('plant-id-select').value;
      if (!plantId) return alert('請先在「個體株號」下拉選單選擇缺株的編號！');

      const fname = fileList[currentFileIndex].name;
      const missingList = projectData[fname].missingPlants;
      if (!missingList.includes(plantId)) {
        missingList.push(plantId);
        saveToLocalStorage();
        renderAnnotationList();
        renderFileList();
      } else {
        alert(`株號 #${plantId} 已經標記為缺株。`);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!currentImage.src) return;

      ctx.save();
      ctx.translate(panX, panY);
      ctx.scale(scale, scale);
      ctx.drawImage(currentImage, 0, 0);

      const fname = fileList[currentFileIndex]?.name;
      const boxes = projectData[fname]?.boxes || [];
      const ratio = getActivePxPerMm();

      // 繪製已儲存的所有框線
      boxes.forEach((b) => {
        const style = CLASS_MAP[b.type];
        ctx.strokeStyle = style.color;
        ctx.lineWidth = 2.5 / scale;
        
        if (b.type === 'scale_bar') {
          ctx.beginPath();
          ctx.moveTo(b.x1, b.y1);
          ctx.lineTo(b.x2, b.y2);
          ctx.stroke();
          
          ctx.fillStyle = style.color;
          ctx.font = `bold ${13 / scale}px sans-serif`;
          ctx.fillText(`Scale (${b.mm}mm)`, b.x1, b.y1 - (6 / scale));
        } else {
          // 固定 ROI 框用虛線區隔，病徵範圍與葉片用實線
          if (b.type === 'UP_ROI' || b.type === 'DOWN_ROI') {
            ctx.setLineDash([6 / scale, 4 / scale]);
          } else {
            ctx.setLineDash([]);
          }

          ctx.strokeRect(b.x, b.y, b.w, b.h);
          ctx.fillStyle = style.color + '25';
          ctx.fillRect(b.x, b.y, b.w, b.h);
          ctx.setLineDash([]);
          
          // 標籤文字：同步顯示類別、株號、Rank 與實際面積(mm²)
          ctx.fillStyle = style.color;
          ctx.font = `bold ${13 / scale}px sans-serif`;
          let tag = `${style.label}`;
          if (b.plantId) tag += ` #${b.plantId}`;
          if (b.type === 'UP_symptom' || b.type === 'DOWN_symptom') {
            tag += ` [Rank:${b.rank}]`;
            if (ratio) {
              const areaMm = ((b.w * b.h) / (ratio * ratio)).toFixed(1);
              tag += ` (${areaMm}mm²)`;
            }
          } else if (b.type === 'UP_ROI' || b.type === 'DOWN_ROI') {
            tag += ` (${b.roiMm}mm框)`;
          }
          ctx.fillText(tag, b.x, b.y - (5 / scale));
        }
      });

      // 繪製正在拖曳中的框線
      if (isDrawing && currentRect) {
        ctx.strokeStyle = CLASS_MAP[currentTool].color;
        ctx.lineWidth = 2.5 / scale;
        if (currentTool === 'scale_bar') {
          ctx.beginPath();
          ctx.moveTo(currentRect.x1, currentRect.y1);
          ctx.lineTo(currentRect.x2, currentRect.y2);
          ctx.stroke();
        } else {
          ctx.strokeRect(currentRect.x, currentRect.y, currentRect.w, currentRect.h);
        }
      }

      // 預覽固定尺度 ROI 小方框（跟隨滑鼠游標顯示 10mm x 10mm 預覽框）
      if ((currentTool === 'UP_ROI' || currentTool === 'DOWN_ROI') && mouseImgX !== null && ratio) {
        const roiMm = parseFloat(document.getElementById('roi-mm-input').value) || 10;
        const sidePx = roiMm * ratio;
        const half = sidePx / 2;

        ctx.strokeStyle = CLASS_MAP[currentTool].color;
        ctx.lineWidth = 2 / scale;
        ctx.setLineDash([5 / scale, 5 / scale]);
        ctx.strokeRect(mouseImgX - half, mouseImgY - half, sidePx, sidePx);
        ctx.setLineDash([]);
        
        // 中心十字準心
        ctx.beginPath();
        ctx.moveTo(mouseImgX - 8 / scale, mouseImgY);
        ctx.lineTo(mouseImgX + 8 / scale, mouseImgY);
        ctx.moveTo(mouseImgX, mouseImgY - 8 / scale);
        ctx.lineTo(mouseImgX, mouseImgY + 8 / scale);
        ctx.stroke();
      }

      ctx.restore();
    }

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.12 : 0.88;
      const mouseX = e.clientX - canvas.offsetLeft;
      const mouseY = e.clientY - canvas.offsetTop;
      panX = mouseX - (mouseX - panX) * zoomFactor;
      panY = mouseY - (mouseY - panY) * zoomFactor;
      scale *= zoomFactor;
      document.getElementById('zoom-level').innerText = `${Math.round(scale * 100)}%`;
      draw();
    });

    window.addEventListener('keydown', (e) => { if (e.code === 'Space') isPanning = true; });
    window.addEventListener('keyup', (e) => { if (e.code === 'Space') isPanning = false; });

    canvas.addEventListener('mousedown', (e) => {
      if (e.button === 1 || isPanning) {
        isPanning = true;
        startPanX = e.clientX - panX;
        startPanY = e.clientY - panY;
        return;
      }
      if (currentFileIndex === -1) return;

      const rect = canvas.getBoundingClientRect();
      const clickX = (e.clientX - rect.left - panX) / scale;
      const clickY = (e.clientY - rect.top - panY) / scale;

      // 如果是固定尺度 ROI 模式（UP_ROI / DOWN_ROI）：單擊滑鼠直接以點擊點為中心蓋出 10mm x 10mm 小方框
      if (currentTool === 'UP_ROI' || currentTool === 'DOWN_ROI') {
        const ratio = getActivePxPerMm();
        if (!ratio) {
          alert('請先使用「畫比例尺線段 (Scale Bar)」標定這張照片的 10mm 比例尺，系統才能換算小方框的像素大小！');
          return;
        }
        const roiMm = parseFloat(document.getElementById('roi-mm-input').value) || 10;
        const sidePx = roiMm * ratio;
        const plantId = document.getElementById('plant-id-select').value;
        
        const box = {
          type: currentTool,
          plantId: plantId || null,
          rank: null,
          roiMm: roiMm,
          x: Math.max(0, clickX - sidePx / 2),
          y: Math.max(0, clickY - sidePx / 2),
          w: sidePx,
          h: sidePx
        };

        const fname = fileList[currentFileIndex].name;
        projectData[fname].boxes.push(box);
        saveToLocalStorage();
        renderAnnotationList();
        renderFileList();
        draw();
        return;
      }

      // 一般拖曳拉框模式
      startX = clickX;
      startY = clickY;
      isDrawing = true;
    });

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      mouseImgX = (e.clientX - rect.left - panX) / scale;
      mouseImgY = (e.clientY - rect.top - panY) / scale;

      if (isPanning && e.buttons) {
        panX = e.clientX - startPanX;
        panY = e.clientY - startPanY;
        draw();
        return;
      }

      if (isDrawing) {
        if (currentTool === 'scale_bar') {
          currentRect = { x1: startX, y1: startY, x2: mouseImgX, y2: mouseImgY };
        } else {
          currentRect = {
            x: Math.min(startX, mouseImgX),
            y: Math.min(startY, mouseImgY),
            w: Math.abs(mouseImgX - startX),
            h: Math.abs(mouseImgY - startY)
          };
        }
      }
      draw();
    });

    canvas.addEventListener('mouseleave', () => {
      mouseImgX = null;
      mouseImgY = null;
      draw();
    });

    canvas.addEventListener('mouseup', () => {
      if (isDrawing && currentRect) {
        const isValid = currentTool === 'scale_bar' 
          ? Math.hypot(currentRect.x2 - currentRect.x1, currentRect.y2 - currentRect.y1) > 5
          : (currentRect.w > 4 && currentRect.h > 4);

        if (isValid) {
          const plantId = document.getElementById('plant-id-select').value;
          const rankVal = document.getElementById('rank-select').value;
          const mmVal = parseFloat(document.getElementById('scale-mm-input').value) || 10;

          const box = {
            type: currentTool,
            plantId: currentTool === 'scale_bar' ? null : (plantId || null),
            rank: (currentTool === 'UP_symptom' || currentTool === 'DOWN_symptom') ? rankVal : null,
            mm: currentTool === 'scale_bar' ? mmVal : null,
            ...currentRect
          };

          const fname = fileList[currentFileIndex].name;
          projectData[fname].boxes.push(box);

          if (currentTool === 'scale_bar') {
            const pxLength = Math.hypot(box.x2 - box.x1, box.y2 - box.y1);
            const ratio = pxLength / mmVal;
            projectData[fname].pxPerMm = ratio;
            globalPxPerMm = ratio;
            updateScaleDisplay(ratio);
          }

          saveToLocalStorage();
          renderAnnotationList();
          renderFileList();
        }
      }
      isDrawing = false;
      currentRect = null;
      draw();
    });

    function setTool(tool) {
      currentTool = tool;
      document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
      document.querySelector(`[data-class="${tool}"]`).classList.add('active');

      const hintEl = document.getElementById('mode-hint');
      if (tool === 'UP_ROI' || tool === 'DOWN_ROI') {
        hintEl.innerText = '模式：單擊接種點中心，自動生成固定物理尺寸 ROI 小方框';
        hintEl.style.color = '#1e90ff';
      } else if (tool === 'scale_bar') {
        hintEl.innerText = '模式：沿著比例尺兩端拖曳畫直線';
        hintEl.style.color = '#00d2d3';
      } else {
        hintEl.innerText = '模式：按住左鍵拖曳框選區域';
        hintEl.style.color = '#2ed573';
      }
      draw();
    }

    function renderAnnotationList() {
      const ul = document.getElementById('annotation-list');
      ul.innerHTML = '';
      const fname = fileList[currentFileIndex]?.name;
      if (!fname || !projectData[fname]) return;
      const ratio = getActivePxPerMm();

      projectData[fname].missingPlants.forEach((pid, idx) => {
        const li = document.createElement('li');
        li.style.color = '#ffa502';
        li.innerHTML = `
          <span>[缺株 Missing] 個體 #${pid}</span>
          <button class="btn btn-danger" style="padding:2px 6px; font-size:0.65rem;" onclick="removeMissing(${idx})">移除</button>
        `;
        ul.appendChild(li);
      });

      projectData[fname].boxes.forEach((b, idx) => {
        const li = document.createElement('li');
        let desc = `${CLASS_MAP[b.type].label}`;
        if (b.plantId) desc += ` (#${b.plantId})`;
        if (b.rank !== null) {
          desc += ` | Rank: <b>${b.rank}</b>`;
          if (ratio) {
            const areaMm = ((b.w * b.h) / (ratio * ratio)).toFixed(1);
            desc += ` (${areaMm}mm²)`;
          }
        } else if (b.type === 'UP_ROI' || b.type === 'DOWN_ROI') {
          desc += ` [${b.roiMm}×${b.roiMm}mm]`;
        } else if (b.type === 'scale_bar') {
          desc += ` [${b.mm}mm]`;
        }

        li.innerHTML = `
          <span>${desc}</span>
          <button class="btn btn-danger" style="padding:2px 6px; font-size:0.65rem;" onclick="deleteBox(${idx})">刪除</button>
        `;
        ul.appendChild(li);
      });
    }

    function removeMissing(idx) {
      const fname = fileList[currentFileIndex].name;
      projectData[fname].missingPlants.splice(idx, 1);
      saveToLocalStorage();
      renderAnnotationList();
      renderFileList();
    }

    function deleteBox(idx) {
      const fname = fileList[currentFileIndex].name;
      projectData[fname].boxes.splice(idx, 1);
      saveToLocalStorage();
      renderAnnotationList();
      renderFileList();
      draw();
    }

    // 匯出 YOLO 訓練格式 (.txt 與 classes.txt)
    function exportYOLO() {
      const allFilenames = Object.keys(projectData);
      if (allFilenames.length === 0) return alert('尚無資料可匯出');
      let exportedCount = 0;

      allFilenames.forEach(fname => {
        const data = projectData[fname];
        if (!data || data.boxes.length === 0 || !data.imgWidth || !data.imgHeight) return;

        let txtLines = [];
        data.boxes.forEach(b => {
          if (b.type === 'scale_bar') return;
          const classId = CLASS_MAP[b.type].id;
          const xCenter = (b.x + b.w / 2) / data.imgWidth;
          const yCenter = (b.y + b.h / 2) / data.imgHeight;
          const wNorm = b.w / data.imgWidth;
          const hNorm = b.h / data.imgHeight;
          txtLines.push(`${classId} ${xCenter.toFixed(6)} ${yCenter.toFixed(6)} ${wNorm.toFixed(6)} ${hNorm.toFixed(6)}`);
        });

        if (txtLines.length > 0) {
          const txtFileName = fname.substring(0, fname.lastIndexOf('.')) + '.txt';
          downloadFile(txtFileName, txtLines.join('\n'));
          exportedCount++;
        }
      });

      if (exportedCount > 0) {
        downloadFile('classes.txt', 'leaf\nUP_symptom\nDOWN_symptom\nUP_ROI\nDOWN_ROI');
      } else {
        alert('尚未繪製任何 YOLO 方框標註');
      }
    }

    // 匯出完整科研 CSV（嚴格對齊 Variety / Repeat / Individual / Side / DAI / Rank，包含病徵範圍面積與固定 ROI 座標）
    function exportCSV() {
      const headers = [
        'Variety', 'Treatment', 'Repeat', 'Individual', 'Side', 'DAI', 
        'Rank', 'Status', 'Symptom_Area_px2', 'Symptom_Area_mm2', 
        'ROI_Box_px', 'Filename'
      ];
      let csvRows = [headers.join(',')];

      Object.keys(projectData).forEach(fname => {
        const data = projectData[fname];
        if (!data) return;
        const m = data.meta;
        const ratio = data.pxPerMm || globalPxPerMm;

        // 1. 缺株紀錄
        data.missingPlants.forEach(pid => {
          ['Up', 'Down'].forEach(side => {
            csvRows.push([
              m.variety, m.treatment, m.repeat, pid, side, m.dai,
              'NA', 'Missing', 'NA', 'NA', 'NA', fname
            ].join(','));
          });
        });

        // 2. 整合每個個體上下部位的「病徵範圍 + Rank」與「固定 ROI 小框」
        const plantsInImage = new Set();
        data.boxes.forEach(b => { if (b.plantId) plantsInImage.add(b.plantId); });

        plantsInImage.forEach(pid => {
          ['Up', 'Down'].forEach(side => {
            const sympType = side === 'Up' ? 'UP_symptom' : 'DOWN_symptom';
            const roiType  = side === 'Up' ? 'UP_ROI' : 'DOWN_ROI';

            const sympBox = data.boxes.find(b => b.plantId === pid && b.type === sympType);
            const roiBox  = data.boxes.find(b => b.plantId === pid && b.type === roiType);

            if (sympBox || roiBox) {
              const rank = sympBox ? sympBox.rank : 'NA';
              const areaPx = sympBox ? (sympBox.w * sympBox.h).toFixed(2) : 'NA';
              const areaMm = (sympBox && ratio) ? ((sympBox.w * sympBox.h) / (ratio * ratio)).toFixed(2) : 'NA';
              const roiStr = roiBox ? `${Math.round(roiBox.x)}_${Math.round(roiBox.y)}_${Math.round(roiBox.w)}x${Math.round(roiBox.h)}` : 'NA';

              csvRows.push([
                m.variety, m.treatment, m.repeat, pid, side, m.dai,
                rank, 'Present', areaPx, areaMm, roiStr, fname
              ].join(','));
            }
          });
        });
      });

      downloadFile('orchid_phenotype_annotations.csv', csvRows.join('\n'));
    }

    function exportJSON() {
      downloadFile('orchid_annotation_backup.json', JSON.stringify(projectData, null, 2));
    }

    function downloadFile(filename, text) {
      const element = document.createElement('a');
      element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(text));
      element.setAttribute('download', filename);
      element.style.display = 'none';
      document.body.appendChild(element);
      element.click();
      document.body.removeChild(element);
    }
  </script>
</body>
